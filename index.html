<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Slug OS">
  <meta name="theme-color" content="#2b1d14">
  <meta name="description" content="Slug OS: a 70s session band in your pocket, plus a lazy-chop sampler.">
  <title>Slug OS</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="src/ui/app.js"></script>
</head>
<body>
  <div id="boot" class="boot" role="button" tabindex="0" aria-label="Tap to start Slug OS">
    <div class="boot-win win">
      <div class="win-title"><span class="box"></span><b>Slug OS</b><span class="box"></span></div>
      <div class="win-body boot-body">
        <div id="boot-snail" class="boot-snail"></div>
        <h1>SLUG OS</h1>
        <p class="tag">a 70s session band in your pocket</p>
        <div class="bevel big" id="boot-btn">TAP TO START</div>
        <div class="slime"><i id="boot-slime"></i></div>
        <p class="hint">iPhone: no sound? Flip the <b>silent switch</b> off and turn the volume up.</p>
      </div>
    </div>
  </div>
  <div id="app" class="app"></div>
</body>
</html>
